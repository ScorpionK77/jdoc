volumes:
  postgres: ~

networks:
  jdoc-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    working_dir: /app
    volumes:
      - ${PWD}:/app
      - ./docker/hosts/app.conf:/etc/nginx/conf.d/default.conf
      - ./docker/hosts/symfony:/etc/nginx/symfony
    ports:
      - "${NGINX_PORT:-8080}:80"
    networks:
      - jdoc-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pguser
    networks:
      - jdoc-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - jdoc-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"     # Порт для обмена сообщениями (AMQP)
      - "15672:15672"   # Порт для веб-интерфейса управления
    networks:
      - jdoc-network

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - jdoc-network

  php:
    build: docker/images/php
    working_dir: /app
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ${PWD}:/app
      - .composer:/.composer
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - jdoc-network