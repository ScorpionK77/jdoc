controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

api.login_check:
    path:       /api/v1/auth
    methods:    POST

app.swagger_ui:
    path: /swagger/{area}
    methods: [GET]
    defaults:
        _controller: nelmio_api_doc.controller.swagger_ui
        area: default